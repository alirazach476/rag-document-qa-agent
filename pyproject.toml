[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-document-qa-agent"
version = "1.0.0"
description = "Retrieval-Augmented Generation agent for grounded document Q&A with LangChain, FAISS, Ollama, and OpenAI."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Ali Raza" }]
keywords = ["rag", "langchain", "faiss", "ollama", "openai", "document-qa", "streamlit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-ollama>=0.2.0",
    "langchain-huggingface>=0.1.0",
    "langchain-community>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "sentence-transformers>=3.0.0",
    "pymupdf>=1.24.0",
    "rank-bm25>=0.2.2",
    "faiss-cpu>=1.8.0",
    "pypdf>=4.0.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.32.0",
    "tiktoken>=0.7.0",
    "openai>=1.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
rag-qa = "rag_qa.cli:main"

[project.urls]
Homepage = "https://github.com/alirazach476/rag-document-qa-agent"
Repository = "https://github.com/alirazach476/rag-document-qa-agent"

[tool.setuptools.packages.find]
where = ["."]
include = ["rag_qa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
